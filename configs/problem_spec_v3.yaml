# Problem specification v3 (benchmark sd2-mo-v3) -- FROZEN.
# Approved 2026-10-13. Supersedes configs/problem_spec_v3_PROPOSED.yaml, which is kept unchanged as the validation
# record. Implementation: daniel/benchmark_v3.py; data and manifest: daniel/data/benchmark_v3/; docs/benchmark_v3.md.
status: FROZEN
version: sd2-mo-v3
checkpoint_tag: bv3                      # required in every v3 --model_suffix
approved: "2026-10-13"
decisions:
  carbon: >-
    Adopt the processing-energy model as proposed. Its operation-level disagreement C1 (14.4% at 10x5, 16.5% at
    20x10) is below the 20% threshold of our own pre-registered diagnostic, which is not a literature requirement.
    The result is documented in results/objective_validation.md; no further tuning.
  tardiness: "TWK with the calibrated (k, s): 10x5 (1.3, 0.8), 20x10 (0.9, 0.2)"
instances:
  family: SD2 (daniel/data_utils.SD2_instance_generator)
  sizes: {"10x5": {n_jobs: 10, n_machines: 5, ops_per_job: 5}, "20x10": {n_jobs: 20, n_machines: 10, ops_per_job: 10}}
  processing_times: integer U{1..99} on each eligible machine; eligible machines per operation U{1..n_machines}
  release_times: 0 for every job
  format: plain SD2 text; the '+carbon+priority' format and operation priorities are retired
  splits:                                # daniel/data/benchmark_v3/<split>/SD2/<size>+mix/
    train: {"10x5": 63, "20x10": 73}             # from data_train/SD2/<size>+mix (canonical grouped split)
    validation: {"10x5": 18, "20x10": 13}        # from data_validation/SD2/<size>+mix
    development: {"10x5": 19, "20x10": 14}       # from data_development/SD2/<size>+mix
    evaluation: {"10x5": 100, "20x10": 100}      # from data_train_vali/SD2/<size>+carbon+priority, annotations stripped
    subsets: {"evaluation/10x5/heldout_49": results/blend_zero_training/split.json}
    final_test: NOT INCLUDED (reserved; not read)
units:
  time_unit: "1 SD2 time unit = 1 minute"
objectives:
  makespan: max_j C_j
  carbon:
    definition: "C = gamma * sum over chosen (o, m) of P_m * p_om / 60   kg CO2e (processing energy only, no idle energy)"
    machine_power_kw: "P_m ~ U(4, 15) per machine"
    gamma_kg_co2e_per_kwh: 0.540
    source: "CEA-FJSP, Wang et al., Frontiers in Environmental Science (2022)"
    validation: "C1 = 14.4% (10x5), 16.5% (20x10) < 20% own threshold; schedule-level trade-off magnitudes pass; accepted"
  total_tardiness:
    definition: "T = sum_j max(0, C_j - d_j)"
    due_dates: "d_j = k_j * W_j (TWK); W_j = sum over the job's operations of the MEAN processing time over eligible machines"
    k_j: "k * (1 + s * (v_j - 0.5)), v_j ~ U(0, 1) per job, i.e. k_j ~ U[k(1 - s/2), k(1 + s/2)]"
    parameters: {"10x5": {k: 1.3, s: 0.8}, "20x10": {k: 0.9, s: 0.2}}
    validation: "PASS on DEV-CAL and DEV-CHECK (rule-based schedules); CP-SAT caveat in results/objective_validation.md"
random_parameters:
  rng: "numpy default_rng(int(sha256('<structural sha256>|<purpose>')[:16], 16))"
  purposes: {power: "P_m, n_machines draws of U(4, 15)", kdraw: "v_j, n_jobs draws of U(0, 1)"}
  key: "structural SHA-256 of the instance (daniel/data_manifest.structural_fjsp_sha256 of the plain file)"
normalised_score:                         # reward v3 (return = -score) and evaluation
  definition: "score = w_m * MK / MKref_i + w_c * C / Cref_i + w_t * T / Tref_size"
  weights: "goal g: 1/|g| on each objective named by g; balanced = (1/3, 1/3, 1/3)"
  MKref_i, Cref_i: "makespan and carbon of the reference heuristic (MWKR job rule, ECT machine rule) on instance i"
  Tref_size: {"10x5": 557.4180230253888, "20x10": 1361.8605498748761}   # mean reference tardiness, train pool
observation_v3:                           # feature schema benchmark_v3_f12_m9_p10
  operation: "10 DANIEL features + job slack + time to due date (12); no priority slot"
  machine: "8 DANIEL features + P_m / 15 (9); z-normalised across machines like the others"
  pair: "8 DANIEL features + carbon_om / 13.365 kg + lateness estimate (10)"
  time_scale: "fixed 99 (SD2 maximum processing time) instead of the batch maximum"
manifest:
  path: daniel/data/benchmark_v3/manifest_benchmark_v3.json
  sha256: 6a8d6dab143156a9c737479e92c033c40b163a4ea42dd08e72182c3d201c33d0
  builder: tools/benchmark_v3/build.py
